<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalikiri Dashboard Login</title>

    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 12px;
        display: flex;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eaf7ff, #c9e7fb, #a9d5ef);
        color: #102c54;
    }

    .login-card {
        width: 100%;
        max-width: 350px;
        margin: auto;
        padding: 20px 24px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 12px 35px rgba(16, 66, 110, 0.18);
    }

    .branding {
        text-align: center;
    }

    .logo {
        display: block;
        width: 90px;
        height: 90px;
        object-fit: contain;
        margin: 0 auto 10px;
    }

    .slogan {
        margin: 0 0 14px;
        color: #075563;
        font-size: 11px;
        font-weight: bold;
        line-height: 1.4;
        letter-spacing: 0.6px;
    }

    h1 {
        margin: 0;
        color: #144b8b;
        font-size: clamp(18px, 5.5vw, 23px);
        font-weight: 800;
        line-height: 1.25;
    }

    .station-name {
        margin: 6px 0 18px;
        color: #0865bd;
        font-size: 25px;
        font-weight: 800;
        letter-spacing: 2px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: bold;
    }

    input {
        width: 100%;
        height: 44px;
        padding: 0 12px;
        border: 1px solid #bdcadd;
        border-radius: 9px;
        background: #ffffff;
        color: #102c54;
        font: inherit;
        font-size: 16px;
    }

    input::placeholder {
        color: #7c8aa1;
    }

    input:focus {
        outline: none;
        border-color: #1285b1;
        box-shadow: 0 0 0 3px rgba(18, 133, 177, 0.15);
    }

    .field {
        margin-bottom: 14px;
    }

    .password-box {
        position: relative;
    }

    .password-box input {
        padding-right: 68px;
    }

    .show-password {
        position: absolute;
        top: 0;
        right: 4px;
        height: 44px;
        padding: 0 10px;
        border: none;
        background: transparent;
        color: #0865a0;
        font-weight: bold;
        cursor: pointer;
    }

    #loginBtn {
        width: 100%;
        height: 44px;
        margin-top: 2px;
        border: none;
        border-radius: 9px;
        background: linear-gradient(135deg, #1489b4, #086c93);
        color: white;
        font-size: 17px;
        font-weight: bold;
        letter-spacing: 1px;
        cursor: pointer;
    }

    #loginBtn:hover {
        box-shadow: 0 5px 14px rgba(8, 108, 147, 0.25);
    }

    button:focus-visible {
        outline: 3px solid #0865bd;
        outline-offset: 3px;
    }

    #message {
        margin: 10px 0 0;
        color: #b42318;
        text-align: center;
        font-size: 13px;
        line-height: 1.4;
        overflow-wrap: anywhere;
    }

    #message:empty {
        margin: 0;
    }

    @media (max-height: 550px) {
        .login-card {
            padding: 14px 20px;
        }

        .logo {
            width: 65px;
            height: 65px;
            margin-bottom: 6px;
        }

        .slogan {
            margin-bottom: 8px;
        }

        .station-name {
            margin-bottom: 12px;
        }

        .field {
            margin-bottom: 10px;
        }
    }

    @media (max-width: 360px) {
        .login-card {
            padding-left: 18px;
            padding-right: 18px;
        }
    }
/* WELCOME SCREEN */
#loginWelcome {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: grid;
  place-items: center;
  padding: 24px;
  background: #12375c;
  text-align: center;
}

#loginWelcome[hidden] {
  display: none;
}

#loginWelcome .welcome-symbol {
  display: block;
  margin-bottom: 18px;
  font-size: 64px;
}

#loginWelcome h2 {
  margin: 0;
  color: #ffe3a3;
  font-size: clamp(24px, 5vw, 36px);
  line-height: 1.5;
}
/* GREEN SCROLLING MESSAGE */
.login-energy-scroll {
  display: block;
  width: 100%;
  overflow: hidden;
  margin: 10px 0 14px;
  padding: 6px 0;
}

.login-energy-scroll > .login-energy-track {
  display: block;
  width: max-content;
  padding-left: 100%;
  white-space: nowrap;
  color: #18794e;
  font-size: 14px;
  font-weight: 700;
  line-height: 26px;
  animation: login-green-scroll 16s linear infinite;
}

@keyframes login-green-scroll {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(0);
  }
}

/* MOVING LEAF */
.login-energy-track .login-leaf {
  display: inline-block;
  transform-origin: bottom center;
  animation: login-leaf-sway 2s ease-in-out infinite;
}

@keyframes login-leaf-sway {
  0%, 100% {
    transform: rotate(-12deg);
  }
  50% {
    transform: rotate(12deg);
  }
}

/* MOVING LIGHTNING */
.login-energy-track .login-bolt {
  display: inline-block;
  animation: login-bolt-move 2s ease-in-out infinite;
}

@keyframes login-bolt-move {
  0%, 100% {
    transform: translateX(-3px) rotate(-8deg);
  }
  50% {
    transform: translateX(3px) rotate(8deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .login-energy-scroll > .login-energy-track {
    animation: none;
    width: auto;
    padding-left: 0;
    white-space: normal;
    text-align: center;
  }

  .login-energy-track .login-leaf,
  .login-energy-track .login-bolt {
    animation: none;
  }
}
/* ENERGY SLOGAN: SIZE, COLOUR AND GLOW */
.login-energy-fixed {
  margin: 14px 0;
  color: #164d75;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.5;
  text-align: center;
  animation: login-slogan-shine 3s ease-in-out infinite;
}

@keyframes login-slogan-shine {
  0%, 100% {
    transform: scale(1);
    color: #164d75;
    text-shadow: 0 0 2px rgba(22, 77, 117, 0.2);
  }

  50% {
    transform: scale(1.06);
    color: #946600;
    text-shadow:
      0 0 5px rgba(223, 181, 79, 0.6),
      0 0 9px rgba(223, 181, 79, 0.3);
  }
}

@media (prefers-reduced-motion: reduce) {
  .login-energy-fixed {
    animation: none;
    transform: none;
    text-shadow: none;
  }
}
/* TWO LOGO HALVES JOIN TOGETHER */
#loginWelcome .welcome-tower {
  position: relative;
  width: 150px;
  aspect-ratio: 1376 / 1584;
  margin: 0 auto 24px;
}

#loginWelcome .tower-half {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  margin: 0;
  filter: drop-shadow(0 0 7px #ffd65a);
}

#loginWelcome .tower-half-left {
  clip-path: inset(0 50% 0 0);
  animation: welcome-join-left 1s ease-out both;
}

#loginWelcome .tower-half-right {
  clip-path: inset(0 0 0 50%);
  animation: welcome-join-right 1s ease-out both;
}

@keyframes welcome-join-left {
  from {
    transform: translateX(-65px);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

@keyframes welcome-join-right {
  from {
    transform: translateX(65px);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

/* CURRENT SHINE AFTER JOINING */
#loginWelcome .welcome-current {
  position: absolute;
  inset: 0;
  pointer-events: none;

  -webkit-mask: url("aptransco-logo.png") center / contain no-repeat;
  mask: url("aptransco-logo.png") center / contain no-repeat;

  background: linear-gradient(
  to bottom,
  transparent 35%,
  #ffd65a 48%,
  #fff4c2 50%,
  #ffd65a 52%,
  transparent 65%
);
  background-size: 100% 300%;
  background-repeat: no-repeat;

  animation: welcome-current-flow 2s linear 1s infinite both;
}

@keyframes welcome-current-flow {
  from {
    background-position: center 100%;
    opacity: 0.8;
  }
  to {
    background-position: center 0%;
    opacity: 0.8;
  }
}

@media (prefers-reduced-motion: reduce) {
  #loginWelcome .tower-half {
    animation: none;
  }

  #loginWelcome .welcome-current {
    display: none;
  }
}
body {
  background: #fff1f5;
}

.login-card {
  background: #ffffff;
}

#loginBtn {
  background: #f0d58e;
  color: #102c54;
  border: 1px solid #b58a24;
  box-shadow: 0 3px 10px #b58a2425;
}

#loginBtn:hover {
  background: #dfb54f;
  color: #102c54;
}

#loginBtn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
</style>
</head>

<body>

    <main class="login-card">

        <div class="branding">
            <img
                src="aptransco-logo.png"
                alt="APTRANSCO Logo"
                class="logo"
            >

            <p class="login-energy-fixed">
  ENERGY SAVED IS ENERGY GENERATED
</p>

           <div class="login-energy-scroll">
  <div class="login-energy-track">
    <span class="login-leaf">🌿</span>
    SAVE ENERGY, SAVE THE NATION
    <span class="login-bolt">⚡</span>
  </div>
</div>
            <h1>400KV SUBSTATION</h1>
            <p class="station-name">KALIKIRI</p>
        </div>

        <div class="field">
            <label for="employeeId">Email ID</label>
            <input
                type="email"
                id="employeeId"
                placeholder="Enter email address"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
            >
        </div>

        <div class="field">
            <label for="password">Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="show-password"
                    id="showPassword"
                    aria-controls="password"
                    aria-label="Show password"
                    aria-pressed="false"
                >Show</button>
            </div>
        </div>

        <button type="button" id="loginBtn">LOGIN</button>

        <p id="message" role="status" aria-live="polite"></p>

    </main>

    <script>
        const showPassword = document.getElementById("showPassword");
        const passwordInput = document.getElementById("password");

        showPassword.addEventListener("click", function () {
            const show = passwordInput.type === "password";

            passwordInput.type = show ? "text" : "password";
            showPassword.textContent = show ? "Hide" : "Show";
            showPassword.setAttribute("aria-pressed", String(show));
            showPassword.setAttribute(
                "aria-label",
                show ? "Hide password" : "Show password"
            );
        });
    </script>

    <script type="module" src="login.js"></script>
 <div id="loginWelcome" hidden role="status">
  <div>
    <div class="welcome-tower" role="img"
     aria-label="Animated APTRANSCO logo">
  <img class="tower-half tower-half-left"
       src="aptransco-logo.png" alt="">

  <img class="tower-half tower-half-right"
       src="aptransco-logo.png" alt="">

  <div class="welcome-current" aria-hidden="true"></div>
</div>
    <h2>
      WELCOME TO<br>
      APTRANSCO KALIKIRI
    </h2>
  </div>
</div>

</body>
</html>
