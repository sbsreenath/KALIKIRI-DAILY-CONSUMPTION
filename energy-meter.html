<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kalikiri Energy Meter Readings</title>

    <link rel="stylesheet" href="design.css">

    <script type="module" src="auth-guard.js"></script>
    <script type="module" src="energy-meter.js"></script>
</head>

<body>
    <header class="dashboard-header">
        <div class="brand">
            <img src="aptransco-logo.png"
                 alt="APTRANSCO logo"
                 width="80"
                 height="80">

            <div>
                <strong>APTRANSCO</strong>
                <span>400 KV SS KALIKIRI</span>
            </div>
        </div>
    </header>

    <nav class="main-nav" aria-label="Main navigation">
        <a href="home.html">
            Home
        </a>

        <a href="energy-meter.html"
           class="active"
           aria-current="page">
            Energy Meter Readings
        </a>

        <a href="Consumption Particulars.html">
            Daily Consumption
        </a>
    </nav>

    <main class="energy-page"
          style="max-width: 1400px; margin: auto; padding: 24px;">

        <h1>ENERGY METER READINGS</h1>

        <div style="margin: 20px 0;">
            <label for="energyDate">Date:</label>
            <input type="date" id="energyDate">
        </div>

        <p id="energyMessage" role="status">
            Select a date to load readings.
        </p>

        <div id="energyTables"></div>

        <div class="energy-actions"
             style="margin-top: 20px;">

            <button type="button"
                    id="saveEnergy"
                    disabled>
                Save Readings
            </button>

            <button type="button"
                    id="printEnergy"
                    disabled>
                Print / PDF
            </button>
        </div>
    </main>
</body>
</html>
